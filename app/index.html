<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fm_board_enhance — 새 기록</title>
<style>
  :root {
    /* clinical-cool · 악센트 #0D6C87 — templates/style.css 와 같은 토큰 */
    --ink: #0f171c;
    --ink-soft: #4f585c;
    --muted: #5d6468;
    --line: rgba(15, 23, 28, 0.14);
    --line-strong: rgba(15, 23, 28, 0.32);
    --accent: #0d6c87;
    --accent-strong: #0a5165;
    --accent-soft: #d1e2e7;
    --mark: #855B00;
    --bg: #f6f8f9;
    --paper: #fdfdfc;
    --surface: #e7edf0;
    --on-accent: #ffffff;
    --radius: 4px;
    --radius-lg: 10px;
    --font-display: "Noto Serif CJK KR", "Noto Serif KR", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans CJK KR", "Noto Sans KR", "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    word-break: keep-all;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 80px; }

  header.bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  header.bar .home {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
  }
  header.bar .home:hover { color: var(--ink); border-color: var(--line-strong); }

  header.bar h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; font-family: var(--font-display); }
  header.bar .spacer { flex: 1; }

  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 8px 14px;
  }
  button:hover { border-color: var(--line-strong); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    padding: 10px 22px;
  }
  button.primary:hover { background: var(--accent-strong); }
  button:disabled { opacity: .55; cursor: default; }

  .fields { display: flex; gap: 10px; margin-bottom: 12px; }
  .fields input {
    font: inherit;
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  .fields input:focus, .fields select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .fields .title { flex: 1 1 60%; font-weight: 700; }
  .fields .category { flex: 1 1 40%; }

  .picks { align-items: stretch; }
  .pickbox { flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; }
  .pickbox > span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .01em; }
  .pickbox select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font: inherit;
  }
  .pickbox select:disabled { color: var(--muted); background: var(--surface); }
  .picks .category { flex: 1 1 0; align-self: flex-end; }

  .edit-card { margin-bottom: 18px; }

  .edit-fields { display: flex; flex-direction: column; gap: 10px; padding: 14px; }

  .edit-fields input,
  .edit-fields select {
    font: inherit;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }

  .edit-fields .picks { display: flex; gap: 10px; }

  .edit-body {
    width: 100%;
    min-height: 320px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
    font-family: ui-monospace, "D2Coding", "Consolas", monospace;
    font-size: 13.5px;
    line-height: 1.7;
    resize: vertical;
  }

  .edit-btn {
    margin-left: 8px;
    padding: 3px 9px;
    font-size: 12.5px;
    border-radius: var(--radius);
  }

  .editor-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .toolbar button {
    border: 1px solid transparent;
    padding: 5px 11px;
    background: none;
    font-size: 14px;
    border-radius: var(--radius);
  }
  .toolbar button:hover { background: var(--surface); }
  .toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .toolbar .hint { margin-left: auto; font-size: 12px; color: var(--muted); }

  .editor {
    min-height: 340px;
    padding: 22px 24px;
    outline: none;
    font-size: 16px;
    line-height: 1.8;
  }
  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
  }
  .editor p, .editor div { margin: 0 0 .55em; }
  .editor b, .editor strong { font-weight: 700; }
  .editor u { text-decoration: underline; text-underline-offset: 2px; }
  .editor img {
    display: block;
    max-width: 100%;
    margin: 12px 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .status { font-size: 12.5px; color: var(--muted); }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--mark); }

  h2.sec {
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 34px 0 10px;
  }

  .recent { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  .recent li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .recent .cat {
    flex: none;
    font-size: 11.5px;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 7px;
  }
  .recent .cat.none { color: var(--mark); background: var(--surface); }
  .recent .t { font-weight: 700; }
  .recent .date { margin-left: auto; flex: none; color: var(--muted); font-size: 12px; }
  .recent .excerpt { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="home" href="./" title="목록으로">← 목록</a>
    <h1>fm_board_enhance</h1>
    <span class="spacer"></span>
    <button id="build">PDF 만들기</button>
  </header>

  <div class="fields">
    <input id="title" class="title" type="text" aria-label="제목" placeholder="제목 (비워두면 본문에서 자동)">
  </div>

  <div class="fields picks">
    <label class="pickbox">
      <span>대단원</span>
      <select id="division" aria-label="대단원"><option value="">— 선택 —</option></select>
    </label>
    <label class="pickbox">
      <span>소단원</span>
      <select id="topic" aria-label="소단원" disabled><option value="">— 대단원 먼저 —</option></select>
    </label>
    <input id="topicCustom" class="category" type="text" aria-label="소단원 직접 입력" placeholder="소단원 직접 입력" hidden>
  </div>

  <div class="editor-card">
    <div class="toolbar">
      <button type="button" data-cmd="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
      <button type="button" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>U</u></button>
      <span class="sep"></span>
      <button type="button" id="pick">이미지</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <span class="hint">Ctrl+Enter 저장 · 이미지는 붙여넣기/드래그</span>
    </div>
    <div id="editor" class="editor" contenteditable="true"
         data-placeholder="개념이나 문제를 그대로 적으면 됩니다. 이미지는 Ctrl+V로 붙여넣으세요."></div>
    <div class="footer">
      <button class="primary" id="save">저장</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <section class="editor-card edit-card" id="edit-card" hidden>
    <div class="toolbar">
      <strong style="font-size:14px">기록 수정</strong>
      <span class="hint" id="edit-id"></span>
      <span class="spacer" style="flex:1"></span>
      <button type="button" id="edit-cancel">취소</button>
    </div>
    <div class="edit-fields">
      <input id="edit-title" type="text" aria-label="수정할 기록 제목" placeholder="제목">
      <div class="picks">
        <label class="pickbox"><span>대단원</span>
          <select id="edit-division" aria-label="수정할 기록 대단원"></select>
        </label>
        <label class="pickbox"><span>소단원</span>
          <select id="edit-topic" aria-label="수정할 기록 소단원"></select>
        </label>
      </div>
      <input id="edit-topic-custom" class="category" type="text" aria-label="소단원 직접 입력" placeholder="소단원 직접 입력" hidden>
      <textarea id="edit-body" class="edit-body" spellcheck="false" aria-label="기록 본문(마크다운)"></textarea>
      <p class="hint">본문은 마크다운 원문이다. 고치고 저장하면 같은 기록이 새 판으로 커밋되고, 다음 병합 때 다시 기본 교재로 들어간다.</p>
      <div class="footer">
        <button class="primary" id="edit-save">수정 저장</button>
        <span id="edit-status" class="status"></span>
      </div>
    </div>
  </section>

  <h2 class="sec">최근 기록</h2>
  <ul class="recent" id="recent"></ul>
</div>

<script>
const editor = document.getElementById("editor");
const titleEl = document.getElementById("title");
const divisionEl = document.getElementById("division");
const topicEl = document.getElementById("topic");
const topicCustomEl = document.getElementById("topicCustom");
const statusEl = document.getElementById("status");
const recentEl = document.getElementById("recent");
const fileEl = document.getElementById("file");

let imageSeq = 0;
const images = new Map();

const CFG = window.FM_CONFIG || null;
const REMOTE = Boolean(CFG && CFG.owner && CFG.repo);
const API = REMOTE ? `https://api.github.com/repos/${CFG.owner}/${CFG.repo}` : "";
const CUSTOM = "__custom__";

// 대단원 → 소단원 목록 (docx 에서 뽑은 base/categories.json, 빌드 때 주입된다)
function categoryMap() {
  return (CFG && CFG.categories) || {};
}

function topicOptions(division) {
  const parts = categoryMap()[division] || {};
  const names = [...new Set(Object.values(parts).flat())];
  return names.filter(Boolean);
}

function fillDivisions() {
  const names = Object.keys(categoryMap());
  const fallback = CFG && Array.isArray(CFG.divisions) ? CFG.divisions : [];
  const list = names.length ? names : fallback;
  divisionEl.innerHTML =
    `<option value="">— 선택 —</option>` +
    list.map((name) => `<option value="${name.replace(/"/g, "&quot;")}">${name}</option>`).join("");
}

function fillTopics(division) {
  const topics = topicOptions(division);
  if (!division) {
    topicEl.innerHTML = `<option value="">— 대단원 먼저 —</option>`;
    topicEl.disabled = true;
    topicCustomEl.hidden = true;
    return;
  }
  topicEl.disabled = false;
  topicEl.innerHTML =
    `<option value="">— 선택 —</option>` +
    topics.map((name) => `<option value="${name.replace(/"/g, "&quot;")}">${name}</option>`).join("") +
    `<option value="${CUSTOM}">기타 (직접 입력)</option>`;
  topicCustomEl.hidden = true;
  topicCustomEl.value = "";
}

divisionEl.addEventListener("change", () => fillTopics(divisionEl.value));
topicEl.addEventListener("change", () => {
  const custom = topicEl.value === CUSTOM;
  topicCustomEl.hidden = !custom;
  if (custom) topicCustomEl.focus();
});

fillDivisions();
fillTopics("");

function ghToken() {
  // pat.txt 를 로컬 서버가 주입하면 그걸 쓰고, 없으면 브라우저에 저장된 값
  return (CFG && CFG.token) || localStorage.getItem("fm_gh_token") || "";
}

function ensureToken() {
  if (!REMOTE) return true;
  if (ghToken()) return true;
  const value = window.prompt(
    "GitHub fine-grained token을 붙여넣으세요.\n(권한: Contents = Read and write, 이 저장소만)\n이 브라우저에만 저장됩니다.",
  );
  if (!value) return false;
  localStorage.setItem("fm_gh_token", value.trim());
  return true;
}

async function gh(path, init = {}) {
  const headers = { Accept: "application/vnd.github+json", ...(init.headers || {}) };
  if (ghToken()) headers.Authorization = `Bearer ${ghToken()}`;
  if (init.body) headers["Content-Type"] = "application/json";

  const response = await fetch(API + path, { ...init, headers });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    if (response.status === 401 || response.status === 403) localStorage.removeItem("fm_gh_token");
    throw new Error(`${response.status} ${detail.message || "GitHub 요청 실패"}`);
  }
  return response.status === 204 ? null : response.json();
}

function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}

function fromBase64(base64) {
  const binary = atob(base64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(binary, (c) => c.charCodeAt(0)));
}

function parseFrontMatter(text) {
  const match = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
  const data = {};
  if (!match) return { data, body: text };
  for (const line of match[1].split(/\r?\n/)) {
    const kv = /^([A-Za-z_][\w-]*)\s*:\s*(.*)$/.exec(line.trim());
    if (kv) data[kv[1].toLowerCase()] = kv[2].replace(/^["']|["']$/g, "");
  }
  return { data, body: text.slice(match[0].length) };
}

function noteId() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  return `${stamp}-${Math.random().toString(36).slice(2, 6)}`;
}

function entryMarkdown(payload, id) {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const created = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  return [
    "---",
    `id: ${id}`,
    `title: ${payload.title}`,
    `created: ${created}`,
    `division: ${payload.division || ""}`,
    `topics: ${payload.topic || ""}`,
    "---",
    "",
    payload.markdown,
    "",
  ].join("\n");
}

async function listRemote() {
  const tree = await gh(`/git/trees/${CFG.branch}?recursive=1`).catch(() => null);
  if (!tree) return [];

  const ids = [];
  for (const node of tree.tree) {
    const match = /^notes\/([^/]+)\/entry\.md$/.exec(node.path);
    if (match) ids.push(match[1]);
  }

  const recent = ids.sort().reverse().slice(0, 12);
  const notes = await Promise.all(
    recent.map(async (id) => {
      try {
        const file = await gh(`/contents/notes/${id}/entry.md?ref=${CFG.branch}`);
        const { data, body } = parseFrontMatter(fromBase64(file.content));
        const split = (value) => String(value || "").split(",").map((v) => v.trim()).filter(Boolean);
        return {
          id,
          title: data.title || "(제목 없음)",
          division: split(data.divisions || data.division || data.categories || data.category)[0] || "",
          part: data.part || "",
          topics: split(data.topics || data.topic),
          created: data.created || "",
          sha: file.sha || "",
          body: body,
          merged: String(data.merged || "").toLowerCase() === "true",
          excerpt: body
            .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
            .replace(/[#>*_\[\]{}]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, 70),
        };
      } catch {
        return null;
      }
    }),
  );
  return notes.filter(Boolean);
}

async function saveRemote(payload) {
  const id = noteId();
  const markdown = entryMarkdown(payload, id);

  const files = [{ path: `notes/${id}/entry.md`, base64: toBase64(markdown) }];
  for (const image of payload.images) {
    files.push({ path: `notes/${id}/${image.name}`, base64: String(image.dataUrl).split(",")[1] || "" });
  }

  for (const file of files) {
    await gh(`/contents/${file.path}`, {
      method: "PUT",
      body: JSON.stringify({
        message: `note: ${payload.title} (${file.path.split("/").pop()})`,
        content: file.base64,
        branch: CFG.branch,
      }),
    });
  }
  return { id };
}

async function listFallback() {
  return fetch("/api/notes").then((r) => r.json()).catch(() => []);
}

function setStatus(text, kind = "") {
  statusEl.textContent = text;
  statusEl.className = "status " + kind;
}

function escapeMarkdown(text) {
  return text
    .replace(/\\/g, "\\\\")
    .replace(/([*_[\]`])/g, "\\$1");
}

function inlineMarkdown(node) {
  let out = "";
  node.childNodes.forEach((child) => {
    if (child.nodeType === Node.TEXT_NODE) {
      out += escapeMarkdown(child.nodeValue);
      return;
    }
    if (child.nodeType !== Node.ELEMENT_NODE) return;

    const tag = child.tagName;
    if (tag === "IMG") {
      out += `\n\n![](${child.dataset.name})\n\n`;
      return;
    }
    if (tag === "BR") {
      out += "\\\n";
      return;
    }

    const inner = inlineMarkdown(child);
    const bold = tag === "B" || tag === "STRONG";
    const underline = tag === "U";

    if (underline && bold) out += `[**${inner}**]{.underline}`;
    else if (underline) out += `[${inner}]{.underline}`;
    else if (bold) out += `**${inner}**`;
    else out += inner;
  });
  return out;
}

function serialize() {
  const blocks = [];
  editor.childNodes.forEach((node) => {
    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "IMG") {
      blocks.push(`![](${node.dataset.name})`);
      return;
    }
    const text = inlineMarkdown(node).replace(/\n{3,}/g, "\n\n").trim();
    if (text) blocks.push(text);
  });
  return blocks.join("\n\n");
}

function addImage(dataUrl) {
  imageSeq += 1;
  const ext = /^data:image\/(png|jpe?g|gif|webp)/.exec(dataUrl)?.[1] || "png";
  const name = `img-${imageSeq}.${ext.replace("jpeg", "jpg")}`;
  images.set(name, dataUrl);

  const img = document.createElement("img");
  img.src = dataUrl;
  img.dataset.name = name;
  editor.appendChild(img);
  editor.appendChild(document.createElement("div"));
  editor.focus();
}

function insertText(text) {
  const lines = text.split(/\r?\n/);
  lines.forEach((line, i) => {
    if (i > 0) editor.appendChild(document.createElement("br"));
    editor.appendChild(document.createTextNode(line));
  });
}

function htmlToText(html) {
  if (!html) return "";
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("br").forEach((br) => br.replaceWith("\n"));
  box.querySelectorAll("p, div, li, tr, h1, h2, h3, h4").forEach((el) => el.append("\n"));
  return box.textContent.replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}

editor.addEventListener("paste", (event) => {
  const items = Array.from(event.clipboardData?.items || []);
  const imageItem = items.find((item) => item.type.startsWith("image/"));
  if (imageItem) {
    event.preventDefault();
    const file = imageItem.getAsFile();
    const reader = new FileReader();
    reader.onload = () => addImage(reader.result);
    reader.readAsDataURL(file);
    return;
  }
  // 앱에 따라 text/plain 이 비어 있고 text/html 만 오는 경우가 있다 → html 도 받아 텍스트로 바꾼다
  const plain = event.clipboardData?.getData("text/plain") || "";
  const text = plain.trim() ? plain : htmlToText(event.clipboardData?.getData("text/html") || "");
  if (!text.trim()) return; // 둘 다 비면 기본 붙여넣기에 맡긴다
  event.preventDefault();
  insertText(text);
});

editor.addEventListener("dragover", (event) => {
  event.preventDefault();
  editor.classList.add("drop");
});
editor.addEventListener("dragleave", () => editor.classList.remove("drop"));
editor.addEventListener("drop", (event) => {
  event.preventDefault();
  editor.classList.remove("drop");
  const files = Array.from(event.dataTransfer?.files || []).filter((f) => f.type.startsWith("image/"));
  files.forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => addImage(reader.result);
    reader.readAsDataURL(file);
  });
});

document.querySelectorAll("[data-cmd]").forEach((button) => {
  button.addEventListener("mousedown", (event) => event.preventDefault());
  button.addEventListener("click", () => {
    editor.focus();
    document.execCommand(button.dataset.cmd);
  });
});

document.getElementById("pick").addEventListener("click", () => fileEl.click());
fileEl.addEventListener("change", () => {
  Array.from(fileEl.files).forEach((file) => {
    const reader = new FileReader();
    reader.onload = () => addImage(reader.result);
    reader.readAsDataURL(file);
  });
  fileEl.value = "";
});

let recentCache = [];
recentEl.addEventListener("click", (event) => {
  const button = event.target.closest(".edit-btn");
  if (!button) return;
  const note = recentCache.find((n) => n.id === button.dataset.id);
  if (note) openEdit(note);
});

async function loadRecent() {
  const notes = REMOTE ? await listRemote() : await listFallback();

  if (!notes.length) {
    recentEl.innerHTML = `<li><span class="excerpt">아직 기록이 없습니다.</span></li>`;
    return;
  }
  recentCache = notes;
  recentEl.innerHTML = notes
    .slice(0, 12)
    .map((n) => {
      const chips = [
        ...(n.division ? [n.division] : []),
        ...(n.topics || []),
      ];
      const cats = chips.length
        ? chips.map((c) => `<span class="cat">${c}</span>`).join("")
        : `<span class="cat none">미분류</span>`;
      const date = (n.created || "").replace("T", " ").slice(5, 16);
      return `<li>${cats}<span class="t">${n.title}</span><span class="excerpt">${n.excerpt}</span><span class="date">${date}</span><button type="button" class="edit-btn" data-id="${n.id}">수정</button></li>`;
    })
    .join("");
}

// ── 기록 수정 ────────────────────────────────────────────────
let editTarget = null;
const editCard = document.getElementById("edit-card");
const editTitle = document.getElementById("edit-title");
const editDivision = document.getElementById("edit-division");
const editTopic = document.getElementById("edit-topic");
const editTopicCustom = document.getElementById("edit-topic-custom");
const editBody = document.getElementById("edit-body");
const editId = document.getElementById("edit-id");
const editStatus = document.getElementById("edit-status");

function setEditStatus(text, kind = "") {
  editStatus.textContent = text;
  editStatus.className = "status " + kind;
}

function editTopicOptions(division, selected) {
  const options = topicOptions(division);
  const list = options.length ? options : [];
  if (selected && !list.includes(selected)) list.push(selected);
  editTopic.innerHTML =
    `<option value="">— 선택 —</option>` +
    list.map((name) => `<option value="${name.replace(/"/g, "&quot;")}">${name}</option>`).join("") +
    `<option value="${CUSTOM}">기타 (직접 입력)</option>`;
  if (selected && list.includes(selected)) {
    editTopic.value = selected;
    editTopicCustom.hidden = true;
  } else if (selected) {
    editTopic.value = CUSTOM;
    editTopicCustom.hidden = false;
    editTopicCustom.value = selected;
  } else {
    editTopic.value = "";
    editTopicCustom.hidden = true;
  }
}

function openEdit(note) {
  editTarget = note;
  editId.textContent = `notes/${note.id}`;
  editTitle.value = note.title === "(제목 없음)" ? "" : note.title;
  editBody.value = note.body || "";

  const divisions = Object.keys(categoryMap());
  editDivision.innerHTML =
    `<option value="">— 선택 —</option>` +
    divisions.map((name) => `<option value="${name.replace(/"/g, "&quot;")}">${name}</option>`).join("");
  editDivision.value = note.division || "";
  editTopicOptions(note.division || "", (note.topics || [])[0] || "");

  setEditStatus(note.merged ? "이미 기본 교재에 병합된 기록 — 수정하면 다시 병합 대상이 된다" : "");
  editCard.hidden = false;
  editCard.scrollIntoView({ behavior: "smooth", block: "start" });
  editTitle.focus();
}

editDivision.addEventListener("change", () => editTopicOptions(editDivision.value, ""));
editTopic.addEventListener("change", () => {
  const custom = editTopic.value === CUSTOM;
  editTopicCustom.hidden = !custom;
  if (custom) editTopicCustom.focus();
});
document.getElementById("edit-cancel").addEventListener("click", () => {
  editCard.hidden = true;
  editTarget = null;
});

document.getElementById("edit-save").addEventListener("click", async () => {
  if (!editTarget) return;
  const body = editBody.value.trim();
  if (!body) {
    setEditStatus("본문이 비어 있다.", "err");
    return;
  }
  const button = document.getElementById("edit-save");
  button.disabled = true;
  setEditStatus("저장 중…");

  const note = {
    id: editTarget.id,
    title: editTitle.value.trim() || deriveTitle(body),
    created: editTarget.created || new Date().toISOString().slice(0, 19),
    division: editDivision.value,
    topic: editTopic.value === CUSTOM ? editTopicCustom.value.trim() : editTopic.value,
    markdown: body,
    merged: false,
  };

  try {
    if (REMOTE) {
      if (!ensureToken()) {
        setEditStatus("토큰이 필요하다.", "err");
        return;
      }
      await updateRemote(note, editTarget.sha);
    } else {
      const res = await fetch(`/api/notes/${encodeURIComponent(note.id)}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(note),
      }).then((r) => r.json());
      if (!res.ok) throw new Error(res.error || "수정 실패");
    }
    setEditStatus("수정됨 → 빌드가 갱신된다");
    editCard.hidden = true;
    editTarget = null;
    loadRecent();
  } catch (error) {
    setEditStatus(error.message, "err");
  } finally {
    button.disabled = false;
  }
});

function frontMatterFor(note) {
  return [
    "---",
    `id: ${note.id}`,
    `title: ${note.title}`,
    `created: ${note.created}`,
    `division: ${note.division || ""}`,
    `topics: ${note.topic || ""}`,
    "---",
    "",
    note.markdown,
    "",
  ].join("\n");
}

async function updateRemote(note, sha) {
  const content = toBase64(frontMatterFor(note));
  await gh(`/contents/notes/${note.id}/entry.md`, {
    method: "PUT",
    body: JSON.stringify({
      message: `edit: ${note.title} (entry.md)`,
      content,
      sha,
      branch: CFG.branch,
    }),
  });
}

function deriveTitle(markdown) {
  const plain = markdown.replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/[*_\[\]`\\{}]/g, "").replace(/\s+/g, " ").trim();
  return plain.slice(0, 40);
}

async function save() {
  let markdown = serialize();
  if (!markdown.trim()) {
    // 붙여넣기가 기본 동작으로 들어간 경우 등 — 편집기의 순수 텍스트로 한 번 더 시도한다
    markdown = (editor.innerText || "")
      .split(/\n{2,}/)
      .map((block) => block.trim())
      .filter(Boolean)
      .join("\n\n");
  }
  if (!markdown.trim()) {
    setStatus("본문이 비어 있습니다. 편집기를 한 번 클릭한 뒤 다시 붙여넣어 주세요.", "err");
    return;
  }
  const button = document.getElementById("save");
  button.disabled = true;
  setStatus("저장 중…");

  try {
    const payload = {
      title: titleEl.value.trim() || deriveTitle(markdown),
      division: divisionEl.value,
      topic: topicEl.value === CUSTOM ? topicCustomEl.value.trim() : topicEl.value,
      markdown,
      images: [...images.entries()].map(([name, dataUrl]) => ({ name, dataUrl })),
    };

    let result;
    if (REMOTE) {
      if (!ensureToken()) {
        setStatus("토큰이 필요합니다.", "err");
        return;
      }
      result = await saveRemote(payload);
    } else {
      result = await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then((r) => r.json());
      if (!result.ok) throw new Error(result.error || "저장 실패");
    }

    editor.innerHTML = "";
    titleEl.value = "";
    divisionEl.value = "";
    fillTopics("");
    topicCustomEl.hidden = true;
    topicCustomEl.value = "";
    images.clear();
    imageSeq = 0;
    setStatus(
      REMOTE ? `저장됨 → notes/${result.id} (Action이 빌드 중)` : `저장됨 → notes/${result.id}`,
      "ok",
    );
    loadRecent();
  } catch (error) {
    setStatus(`저장 실패: ${error.message}`, "err");
  } finally {
    button.disabled = false;
  }
}

document.getElementById("save").addEventListener("click", save);

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    save();
  }
});

document.getElementById("build").addEventListener("click", async (event) => {
  const button = event.currentTarget;

  if (REMOTE) {
    if (CFG.pages) {
      window.open(`${CFG.pages}pdf/fm_board_all.pdf`, "_blank");
      setStatus("PDF를 새 탭에서 엽니다 (Action 반영까지 1~2분)", "ok");
    }
    return;
  }

  button.disabled = true;
  setStatus("PDF 생성 중…");
  try {
    const result = await fetch("/api/build", { method: "POST" }).then((r) => r.json());
    const last = (result.output || "").split("\n").filter(Boolean).pop() || "";
    setStatus(result.ok ? `완료: ${last}` : `실패: ${last}`, result.ok ? "ok" : "err");
  } catch (error) {
    setStatus(`실패: ${error.message}`, "err");
  } finally {
    button.disabled = false;
  }
});

loadRecent();
editor.focus();
</script>
