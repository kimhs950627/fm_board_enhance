name: build-and-deploy

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "app/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pandoc and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc fonts-noto-cjk fonts-noto-cjk-extra fonts-nanum
          fc-cache -f
          echo "한글 글꼴 $(fc-list :lang=ko | wc -l)개"
          fc-match "Noto Sans CJK KR"
          test "$(fc-list :lang=ko | wc -l)" -gt 0

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Build HTML + PDF
        env:
          CI: "1"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
